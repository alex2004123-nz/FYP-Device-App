<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAP Pressure Control</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>PAP Device Control</h1>

<div class="layout">
  <div><p class="connect_stat" id="connect_status"> Not connected yet... </p></div>
  <div class="connect_row"><button class="bt_button" id="bluetoothConnect">Connect Bluetooth</button></div>
  <div><h2>Pressure</h2></div>
  <div><p id="pressureDisplay"> Not connected yet... </p></div>
  <div class="pap-row">
    <button class="bt_button, pap-btn" id="CPAP" data-pap="0">CPAP</button>
    <button class="bt_button, pap-btn" id="BiPAP" data-pap="0">BiPAP</button> 
    <button class="bt_button, pap-btn" id="APAP" data-pap="0">APAP</button> 
</div>
  <div class="bt_wrapper"><button class="center-btn" id="increaseExpirButton">+</button></div>
  <div><p id="setPressureDisplay">Not connected yet...</p></div>
  <div class="bt_wrapper"><button class="center-btn" id="decreaseExpirButton">-</button></div>
    <div class="bt_wrapper"><button class="center-btn" id="increaseInspirButton">+</button></div>
  <div><p id="setInspirPressureDisplay">Not connected yet...</p></div>
  <div class="bt_wrapper"><button class="center-btn" id="decreaseInspirButton">-</button></div>
</div>

 

</body>
</html>
