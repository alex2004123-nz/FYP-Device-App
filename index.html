<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAP Pressure Control</title>
    <script src="script.js" defer></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>PAP Device Control</h1>

<div class="layout">
  <div><p class="connect_stat" id="connect_status"> Not connected yet... </p></div>
  <div class="bt_wrapper"><button class="bt_button" id="bluetoothConnect">Connect Bluetooth</button></div>

  <!-- Mode (phone -> ESP32) -->
  <div class="card">
    <h2>Mode</h2>
    <div class="mode_row">
      <button class="mode_btn" data-mode="STANDBY">Standby</button>
      <button class="mode_btn" data-mode="CPAP">CPAP</button>
      <button class="mode_btn" data-mode="BIPAP">BiPAP</button>
    </div>
  </div>

  <!-- Live readings (PEEP -> ESP32 -> phone) -->
  <div class="card">
    <h2>Pressure</h2>
    <p id="pressureDisplay"> Not connected yet... </p>
    <p class="small">Target: <span id="setPressureDisplay">--</span></p>
    <p class="small">Flow: <span id="flowDisplay">--</span></p>
    <p class="small">Phase: <span id="phaseDisplay">--</span> &middot; Valve link: <span id="linkDisplay">--</span></p>
  </div>

  <!-- Set pressures (phone -> ESP32) -->
  <div class="card">
    <h2>Inspiratory (IPAP)</h2>
    <div class="adjust_row">
      <button class="round_btn" id="ipapDown">-</button>
      <span class="set_value" id="ipapDisplay">--</span>
      <button class="round_btn" id="ipapUp">+</button>
    </div>
  </div>

  <div class="card">
    <h2>Expiratory (EPAP / CPAP)</h2>
    <div class="adjust_row">
      <button class="round_btn" id="epapDown">-</button>
      <span class="set_value" id="epapDisplay">--</span>
      <button class="round_btn" id="epapUp">+</button>
    </div>
  </div>
</div>

</body>
</html>
